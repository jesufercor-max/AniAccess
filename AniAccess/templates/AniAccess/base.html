{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AniAccess{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'AniAccess/css/estilos.css' %}">
</head>

<body>
    <header class="main-header">
        <div class="container navbar">
            <a href="{% url 'index' %}" class="logo">
                <span class="logo-symbol">◈</span>
                <span>AniAccess</span>
            </a>
            <nav class="main-nav">
                <a href="{% url 'index' %}">Inicio</a>
            </nav>


        </div>
    </header>

    <main class="main-content container">
        {% block content %}{% endblock %}
    </main>

    <footer class="main-footer">
        <div class="container footer-content">
            <p>AniAccess · Anime accesible para todas las personas.</p>
        </div>
    </footer>
    <article class="card">
        <h2>Ranking de accesibilidad</h2>
        <p>Descubre los títulos mejor valorados por la comunidad.</p>
        <a href="{% url 'ranking_accesibilidad' %}" class="btn">
            Ver ranking
        </a>
    </article>
</body>

</html>
